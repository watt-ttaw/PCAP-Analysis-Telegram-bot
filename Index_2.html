<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PCAP Analyzer</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--card:var(--tg-theme-secondary-bg-color,#f1f3f5);--text:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#80858d);--accent:var(--tg-theme-button-color,#2481cc);--on-accent:var(--tg-theme-button-text-color,#fff);--ok:#2e9e6b;--warn:#d98e04;--line:rgba(128,128,128,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:15px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
#app{padding:18px 16px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
h1{font-size:24px;line-height:1.2;margin:0 0 6px}
h2{font-size:13px;font-weight:600;color:var(--hint);margin:28px 0 8px}
p{margin:0 0 10px}.muted{color:var(--hint);font-size:13.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* upload */
.drop{display:block;margin:20px 0 14px;padding:34px 16px;border:2px dashed var(--line);border-radius:16px;text-align:center;cursor:pointer}
.drop:active{background:var(--card)}
.drop svg{width:38px;height:38px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.drop b{display:block;margin-top:8px;font-size:17px}
input[type=file]{display:none}
.steps{margin:18px 0 0;padding:0;list-style:none}
.steps li{padding:6px 0 6px 26px;position:relative;color:var(--hint)}
.steps li::before{content:"";position:absolute;left:6px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--line)}
.steps li.on{color:var(--text);font-weight:600}.steps li.on::before{background:var(--accent)}
.steps li.done::before{background:var(--ok)}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:14px 0 4px}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.meter.pulse i{width:40%;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.meter.pulse i{animation:none;width:100%;opacity:.5}}
.err{border-left:3px solid #d64545;padding:2px 0 2px 12px;margin:14px 0}.err b{display:block}

/* report */
.verdict{border-left:5px solid var(--ok);padding:2px 0 2px 14px;margin:6px 0 0}
.verdict.warn{border-color:var(--warn)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip div{padding:12px 4px;text-align:center;min-width:0}.strip div+div{border-left:1px solid var(--line)}
.strip b{display:block;font-size:16px}.strip span{font-size:12.5px;color:var(--hint)}
.find{border-left:3px solid var(--warn);padding:2px 0 2px 12px;margin:14px 0}
.find.info{border-color:var(--accent)}.find b{display:block}
.find span{color:var(--hint);font-size:13.5px;word-break:break-word}
.ai{background:var(--card);border-radius:12px;padding:12px 14px}.ai p:last-child{margin:0}
.tabs{display:flex;gap:2px;padding:3px;background:var(--card);border-radius:10px}
.tabs button{flex:1;border:0;background:none;color:var(--hint);padding:8px 2px;border-radius:8px;font:inherit;font-size:13.5px}
.tabs button.on{background:var(--bg);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.chart{margin-top:10px;background:#fff;border-radius:10px;padding:4px}
.chart img{display:block;width:100%}
.chart+.muted{margin-top:6px}
details{border-bottom:1px solid var(--line)}
summary{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;font-weight:600;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--hint);border-bottom:2px solid var(--hint);transform:rotate(45deg);transition:transform .15s}
details[open] summary::after{transform:rotate(-135deg)}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;font-size:14px}
.row+.row{border-top:1px solid var(--line)}
.row .a{min-width:0;word-break:break-all}
.row .r{flex:none;text-align:right;color:var(--hint);font-size:13px;max-width:62%;word-break:break-all}
.row .r b{display:block;color:var(--text);font-size:14px}
details>.row:last-child{margin-bottom:8px}

/* buttons */
button{font:inherit}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
#bar button{flex:1;border:0;border-radius:12px;padding:13px 8px;font-weight:600;font-size:15px}
.p{background:var(--accent);color:var(--on-accent)}.s{background:var(--card);color:var(--accent)}
button:disabled{opacity:.55}
.link{display:block;width:100%;margin-top:22px;padding:12px;border:0;background:none;color:var(--accent);font-size:14.5px}
#zoom{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:8px}
#zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="bar" hidden></div>
<div id="zoom" hidden></div>
<script>
const tg = Telegram.WebApp; tg.ready(); tg.expand();
const H = {Authorization: "tma " + tg.initData};
const KEY = "lastReport";
const $ = id => document.getElementById(id);
const app = $("app"), bar = $("bar");
// append() with a string makes a text node, so capture data can never inject HTML
const el = (tag, props, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); e.append(...kids.flat()); return e; };
const hap = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const store = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const zoom = src => { const z = $("zoom"); z.replaceChildren(el("img", {src})); z.hidden = false; z.onclick = () => { z.hidden = true; }; };

function home(err) {
  bar.hidden = true;
  const input = el("input", {type: "file", accept: ".pcap,.pcapng,.cap", onchange: () => input.files[0] && upload(input.files[0])});
  const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  icon.setAttribute("viewBox", "0 0 24 24");
  icon.innerHTML = '<path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/>'; // static markup, no capture data
  app.replaceChildren(
    el("h1", {}, "Analyze a capture"),
    el("p", {className: "muted"}, "Upload a .pcap or .pcapng file, for example one recorded with PCAPdroid."),
    err ? el("div", {className: "err"}, el("b", {}, "That didn't work"), err) : "",
    el("label", {className: "drop"}, input, icon, el("b", {}, "Choose a capture file"), el("span", {className: "muted"}, "Up to 50 MB")),
    el("p", {className: "muted"}, "You get a plain-language report, a PDF, and answers to your questions in chat. The file is deleted as soon as it is analysed, and the report after about 2 hours."));
}

function busy(step, pct) {
  bar.hidden = true;
  const li = (t, i) => el("li", {className: i < step ? "done" : i === step ? "on" : ""}, t);
  app.replaceChildren(el("h1", {}, step ? "Analysing your capture" : "Uploading your capture"),
    el("div", {id: "meter", className: "meter" + (step ? " pulse" : "")}, el("i", {id: "fill", style: `width:${pct || 0}%`})),
    el("ul", {className: "steps"}, ["Upload", "Analyse the traffic", "Build the report"].map(li)),
    el("p", {className: "muted"}, step ? "Large files can take a minute." : "Keep this window open."));
}

function upload(file) {
  busy(0, 0);
  const fd = new FormData(); fd.append("file", file);
  const x = new XMLHttpRequest();
  x.open("POST", "/api/upload"); x.setRequestHeader("Authorization", H.Authorization);
  x.upload.onprogress = ev => { const f = $("fill"); if (f && ev.lengthComputable) f.style.width = (ev.loaded / ev.total * 100) + "%"; };
  x.onload = () => {
    let r = {}; try { r = JSON.parse(x.responseText); } catch (e) {}
    if (x.status !== 200) return home(r.detail || "Upload failed. Try again.");
    busy(1); poll(r.job_id);
  };
  x.onerror = () => home("Network error during upload. Check your connection and try again.");
  x.send(fd);
}

async function poll(id) {
  try {
    const r = await (await fetch("/api/jobs/" + id, {headers: H})).json();
    if (r.detail) return home(r.detail);
    if (r.state === "done") return show(id, true);
    if (r.state === "error") return home(r.error || "Analysis failed. Try another file.");
    setTimeout(() => poll(id), 2000);
  } catch (e) { home("Lost connection. Reopen the app and try again."); }
}

async function post(id, what, btn, ok) {
  btn.disabled = true;
  try {
    const r = await fetch(`/api/reports/${id}/${what}`, {method: "POST", headers: H});
    if (!r.ok) { hap("error"); tg.showAlert((await r.json()).detail || "Something went wrong."); return false; }
    hap("success"); if (ok) tg.showAlert(ok);
    return true;
  } catch (e) { tg.showAlert("Network error. Try again."); return false; }
  finally { btn.disabled = false; }
}

async function show(id, fresh) {
  let d;
  try {
    const r = await fetch("/api/reports/" + id, {headers: H});
    if (!r.ok) throw 0;
    d = await r.json();
  } catch (e) { store(KEY, null); return fresh ? home("Could not load the report.") : home(); }
  store(KEY, id); if (fresh) hap("success");
  const s = d.stats, n = d.indicators.length;
  const row = (a, r) => el("div", {className: "row"}, el("div", {className: "a"}, a), el("div", {className: "r"}, r));
  const sec = (title, rows, open) => rows.length ? el("details", {open: !!open}, el("summary", {}, title), ...rows) : "";
  const stat = (k, v) => el("div", {}, el("b", {}, String(v)), el("span", {}, k));

  const tabsData = [["timeline", "Timeline"], ["protocols", "Protocols"], ["talkers", "Talkers"], ["graph", "Graph"]].filter(([k]) => d.charts[k]);
  let charts = [];
  if (tabsData.length) {
    const img = el("img", {src: d.charts[tabsData[0][0]], onclick: () => zoom(img.src)});
    const tabs = el("div", {className: "tabs"}, ...tabsData.map(([k, t], i) => {
      const b = el("button", {textContent: t, className: i ? "" : "on", onclick: () => {
        tabs.querySelectorAll("button").forEach(x => { x.className = ""; });
        b.className = "on"; img.src = d.charts[k];
      }});
      return b;
    }));
    charts = [el("h2", {}, "Charts"), tabs, el("div", {className: "chart"}, img), el("div", {className: "muted"}, "Tap a chart to enlarge it.")];
  }

  app.replaceChildren(
    el("div", {className: "verdict" + (n ? " warn" : "")},
      el("h1", {}, n ? `${n} thing${n > 1 ? "s" : ""} worth a look` : "Nothing unusual found"),
      el("div", {className: "muted"}, n ? "These are hints from automatic checks, not proof of a problem." : "The automatic checks found no obvious problems. That does not guarantee the traffic is safe.")),
    el("div", {className: "strip"}, stat("packets", s.packets.toLocaleString()), stat("data", s.bytes), stat("duration", s.duration), stat("hosts", s.hosts)),
    ...(d.summary ? [el("h2", {}, "Summary (written by AI, check it before relying on it)"),
      el("div", {className: "ai"}, ...d.summary.split(/\n+/).map(p => el("p", {}, p)))] : []),
    ...(n ? [el("h2", {}, "What was flagged"), ...d.indicators.map(([t, x]) => el("div", {className: "find" + (t === "Traffic burst" ? " info" : "")}, el("b", {}, t), el("span", {}, x)))] : []),
    ...charts,
    el("h2", {}, "Details"),
    sec("Top conversations", d.conversations.map(([a, b, p, sz]) => row(`${a} \u2194 ${b}`, [el("b", {}, sz), `${p.toLocaleString()} packets`])), true),
    ...Object.entries(d.names).map(([t, rows]) => sec(t, rows.map(([nm, c]) => row(nm, "\u00d7" + c)))),
    sec("File details", d.meta.map(([k, v]) => row(k, v))),
    el("button", {className: "link", textContent: "Analyze another capture", onclick: () => { store(KEY, null); home(); }}));

  bar.replaceChildren(
    el("button", {className: "s", textContent: "Send PDF", onclick: e => post(id, "pdf", e.currentTarget, "The PDF was sent to your chat.")}),
    el("button", {className: "p", textContent: "Ask in chat", onclick: async e => { if (await post(id, "discuss", e.currentTarget)) tg.close(); }}));
  bar.hidden = false; window.scrollTo(0, 0);
}

if (!tg.initData) home("Open this page from the bot in Telegram.");
else {
  let last = null; try { last = localStorage.getItem(KEY); } catch (e) {}
  if (last) { busy(1); show(last, false); } else home();
}
</script>
</body>
</html>
